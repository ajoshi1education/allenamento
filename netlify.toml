[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Optional AI helper. It stays switched off until ANTHROPIC_API_KEY is set in
# Netlify → Site configuration → Environment variables (paid per use).
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
