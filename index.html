<body>
  <div id="app"><div class="loading">Caricamento…</div></div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.hostname !== "localhost") {
      // When a new version is published, switch to it straight away (once) instead of on the next visit.
      const hadController = !!navigator.serviceWorker.controller;
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded && !document.body.classList.contains("in-session")) { reloaded = true; location.reload(); } });
      navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {});
    }
  </script>
